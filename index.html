
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI VIP - Trợ lý thông minh</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#212121;color:#eee;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;flex-direction:column
}
header{
 height:60px;padding:0 16px;display:flex;
 align-items:center;justify-content:space-between;
 border-bottom:1px solid #383838;background:#171717
}
.brand{font-size:20px;font-weight:bold;color:#8ab4ff}
button{cursor:pointer;border:0;border-radius:10px}
#newChat{background:#333;color:white;padding:10px 14px}
#chat{
 flex:1;overflow-y:auto;padding:20px 14px;
 width:100%;max-width:850px;margin:auto
}
.welcome{text-align:center;margin-top:18vh;color:#ddd}
.welcome h1{font-size:27px}
.message{display:flex;margin:20px 0;gap:10px}
.avatar{
 width:34px;height:34px;flex-shrink:0;
 border-radius:50%;background:#444;
 display:grid;place-items:center;font-size:15px
}
.content{
 white-space:pre-wrap;overflow-wrap:anywhere;
 line-height:1.65;padding:5px 0;max-width:100%
}
.user .avatar{background:#245ba0}
.ai .avatar{background:#176b50}
#bottom{padding:12px 14px 20px;background:#212121}
#form{
 max-width:850px;margin:auto;display:flex;gap:8px;
 background:#303030;border:1px solid #555;
 border-radius:20px;padding:10px
}
textarea{
 flex:1;resize:none;min-height:44px;max-height:130px;
 background:transparent;border:0;outline:0;color:white;
 font-size:16px;padding:10px
}
#send{
 background:#fff;color:#111;padding:0 18px;
 font-weight:bold
}
#send:disabled{opacity:.5}
.note{text-align:center;color:#888;font-size:11px;margin:12px}
</style>
</head>
<body>
<header>
 <div class="brand">✦ AI VIP</div>
 <button id="newChat">＋ Chat mới</button>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <h1>AI VIP sẵn sàng</h1>
  <p>Bạn muốn hỏi điều gì hôm nay?</p>
 </div>
</main>

<div id="bottom">
 <form id="form">
  <textarea id="prompt" placeholder="Nhắn tin cho AI VIP..." rows="1"></textarea>
  <button id="send" type="submit">Gửi ↑</button>
 </form>
 <div class="note">AI có thể mắc lỗi. Không chia sẻ thông tin cá nhân hoặc mật khẩu.</div>
</div>

<script>
// Thay bằng địa chỉ Cloudflare Worker sau khi tạo xong
const API_URL = "DAN_DIA_CHI_WORKER_CUA_BAN";

const chat=document.getElementById("chat");
const form=document.getElementById("form");
const promptBox=document.getElementById("prompt");
const send=document.getElementById("send");
let messages=[];

function save(){
 try{localStorage.setItem("aivip-history",JSON.stringify(messages))}
 catch(e){}
}
function addMessage(role,text){
 document.getElementById("welcome")?.remove();
 const row=document.createElement("div");
 row.className="message "+(role==="user"?"user":"ai");
 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=role==="user"?"Bạn":"✦";
 const content=document.createElement("div");
 content.className="content";
 content.textContent=text;
 row.append(avatar,content);
 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;
 return content;
}
function load(){
 try{
  messages=JSON.parse(localStorage.getItem("aivip-history")||"[]");
  messages.forEach(m=>addMessage(m.role,m.content));
 }catch(e){messages=[]}
}
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const text=promptBox.value.trim();
 if(!text||send.disabled)return;
 if(API_URL==="DAN_DIA_CHI_WORKER_CUA_BAN"){
  alert("AI VIP chưa được kết nối máy chủ. Hãy hoàn thành bước Cloudflare.");
  return;
 }
 messages.push({role:"user",content:text});
 addMessage("user",text);
 promptBox.value="";
 send.disabled=true;
 const loading=addMessage("assistant","AI VIP đang suy nghĩ...");
 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages:messages.slice(-16)})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Lỗi kết nối");
  if(!data.reply)throw new Error("AI chưa trả lời");
  loading.textContent=data.reply;
  messages.push({role:"assistant",content:data.reply});
  save();
 }catch(err){
  loading.textContent="Không thể kết nối AI: "+err.message;
 }finally{
  send.disabled=false;
  promptBox.focus();
  chat.scrollTop=chat.scrollHeight;
 }
});
document.getElementById("newChat").onclick=()=>{
 messages=[];
 save();
 chat.innerHTML='<div class="welcome" id="welcome"><h1>AI VIP sẵn sàng</h1><p>Bạn muốn hỏi điều gì hôm nay?</p></div>';
};
promptBox.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();form.requestSubmit();
 }
});
load();
</script>
</body>
</html>
